---
name: Caddy image

on:
  push:
    branches: [main]
    paths:
      - images/caddy/**
      - roles/proxy/templates/Caddyfile.j2
      - roles/proxy/defaults/main.yml
      - .github/workflows/caddy-image.yml
  pull_request:
    paths:
      - images/caddy/**
      - roles/proxy/templates/Caddyfile.j2
      - roles/proxy/defaults/main.yml
      - .github/workflows/caddy-image.yml
  schedule:
    - cron: '40 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: caddy-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Caddy (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15.2'
      - run: pip install Jinja2 PyYAML
      - uses: docker/setup-buildx-action@v4
      - name: Build native test image
        uses: docker/build-push-action@v7
        with:
          context: images/caddy
          load: true
          tags: homelab-caddy:test
          cache-from: type=gha,scope=caddy-${{ runner.arch }}
          cache-to: type=gha,mode=max,scope=caddy-${{ runner.arch }}
      - name: Validate binary, DNS modules and actual Caddyfile template
        run: python images/caddy/validate.py homelab-caddy:test

  publish:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Compute image tags
        id: meta
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          image="ghcr.io/${SOURCE_REPOSITORY,,}/caddy-dns"
          version=$(sed -n 's/^ARG CADDY_VERSION=v//p' images/caddy/Dockerfile)
          immutable="$image:$version-build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          {
            echo 'tags<<EOF'
            echo "$immutable"
            if [ "$GITHUB_REF" = 'refs/heads/main' ]; then
              echo "$image:$version"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested multi-architecture image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: images/caddy
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: mode=max
          sbom: true
          cache-from: |
            type=gha,scope=caddy-X64
            type=gha,scope=caddy-ARM64
          cache-to: type=gha,mode=max,scope=caddy-publish
      - name: Record immutable deployment reference
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "Deployment reference = $IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
