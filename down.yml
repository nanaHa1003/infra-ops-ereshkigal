---
- name: Gracefully shut down the Ereshkigal Homelab
  hosts: homelab
  become: true

  tasks:
    # Stop existing stacks, including services omitted from enabled_services.

    - name: Stop aria2 stack
      ansible.builtin.import_role:
        name: aria2
        tasks_from: down.yml
      tags: [aria2]

    - name: Stop n8n stack
      ansible.builtin.import_role:
        name: n8n
        tasks_from: down.yml
      tags: [n8n]

    - name: Stop homepage stack
      ansible.builtin.import_role:
        name: homepage
        tasks_from: down.yml
      tags: [homepage]

    - name: Stop mealie stack
      ansible.builtin.import_role:
        name: mealie
        tasks_from: down.yml
      tags: [mealie]

    - name: Stop immich stack
      ansible.builtin.import_role:
        name: immich
        tasks_from: down.yml
      tags: [immich]

    - name: Stop pinchflat stack
      ansible.builtin.import_role:
        name: pinchflat
        tasks_from: down.yml
      tags: [pinchflat]

    - name: Stop wordpress stack
      ansible.builtin.import_role:
        name: wordpress
        tasks_from: down.yml
      tags: [wordpress]

    - name: Stop auth stack
      ansible.builtin.import_role:
        name: auth
        tasks_from: down.yml
      tags: [auth]

    - name: Stop proxy stack
      ansible.builtin.import_role:
        name: proxy
        tasks_from: down.yml
      tags: [proxy]
