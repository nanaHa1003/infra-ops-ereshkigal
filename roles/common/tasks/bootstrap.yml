---
- name: Gather installed packages before non-destructive bootstrap
  ansible.builtin.package_facts:
    manager: auto
  when: not common_remove_conflicts | bool

- name: Validate container package compatibility
  ansible.builtin.import_tasks: validate_packages.yml

# 1. Remove Podman and conflicting packages
- name: Remove Podman and related packages
  when: common_remove_conflicts | bool
  ansible.builtin.dnf5:
    name:
      - podman
      - podman-docker
      - buildah
      - skopeo
    state: absent

# 2. Setup Docker Repo & Install (Fedora specific)
- name: Add Docker Repository
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/fedora/docker-ce.repo
    dest: /etc/yum.repos.d/docker-ce.repo
    mode: '0644'

- name: Install Docker Engine
  ansible.builtin.dnf5:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
      - python3-requests
    state: present

- name: Ensure Docker is started and enabled
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

# 3. Setup the operator user
- name: Add user to docker group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true
