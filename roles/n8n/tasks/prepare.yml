---
- name: Create n8n stack directory
  ansible.builtin.file:
    path: "{{ stack_root }}/n8n"
    state: directory
    owner: 0
    group: 0
    mode: '0755'

- name: Deploy n8n Compose
  ansible.builtin.template:
    src: n8n.yml.j2
    dest: "{{ stack_root }}/n8n/docker-compose.yml"
    mode: '0600'
  diff: false
  no_log: true
  register: n8n_compose
