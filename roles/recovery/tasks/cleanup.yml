---
- name: Refresh protected recovery configuration
  ansible.builtin.import_tasks: config.yml

- name: Clean explicitly selected recovery run
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - "{{ recovery_program_dir }}/recovery_runner.py"
      - --config
      - "{{ recovery_config_dir }}/config.json"
      - cleanup
      - --run
      - "{{ recover_run_id }}"
  register: recovery_cleanup_result
  changed_when: recovery_cleanup_result.rc == 0
