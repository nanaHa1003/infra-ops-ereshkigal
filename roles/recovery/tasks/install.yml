---
- name: Require a capable replacement host
  ansible.builtin.assert:
    that:
      - recovery_probe.capabilities.values() | select('equalto', false) | list | length == 0
      - recovery_probe.mount_ok | bool
      - not recovery_probe.service_probe_failed | bool
      - not recovery_probe.active_backup_timers | bool
      - not recovery_probe.ddns_active | bool
      - recovery_probe.free_bytes | int >= recover_min_free_bytes | int
    fail_msg: "Prepare Docker Engine, Compose v2, Restic, Python/PyYAML and storage before recovery. Inspect the plan for failed capabilities."
    quiet: true

- name: Create protected recovery program and configuration directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0700'
  loop: ["{{ recovery_program_dir }}", "{{ recovery_config_dir }}"]

- name: Install recovery modules
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ recovery_program_dir }}/{{ item }}"
    owner: root
    group: root
    mode: '0700'
  loop: [recovery_runner.py, recovery_models.py, recovery_manifest.py, recovery_files.py, recovery_state.py, recovery_databases.py, recovery_verify.py, recovery_activate.py]

- name: Install shared backup modules without backup role side effects
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/roles/backup/files/{{ item }}"
    dest: "{{ recovery_program_dir }}/{{ item }}"
    owner: root
    group: root
    mode: '0700'
  loop: [backup_common.py, backup_sources.py, backup_direct.py]

- name: Refresh protected recovery configuration
  ansible.builtin.import_tasks: config.yml
