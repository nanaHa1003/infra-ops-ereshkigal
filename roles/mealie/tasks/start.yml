---
- name: Start/Update Mealie
  community.docker.docker_compose_v2:
    project_src: "{{ stack_root }}/mealie"
    state: present
    pull: "{{ 'always' if pull_images | default(false) | bool else 'missing' }}"
    recreate: "{{ 'always' if mealie_force_restart | bool else 'auto' }}"
  tags: [molecule-notest]
