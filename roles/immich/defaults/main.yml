---
# Default variables for the immich role.

immich_server_image: "ghcr.io/immich-app/immich-server:v2.7.5"
# CPU inference is the known-working configuration for the current host.
immich_ml_image: "ghcr.io/immich-app/immich-machine-learning:v2.7.5"
immich_postgres_image: "ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0"
immich_redis_image: "docker.io/valkey/valkey:8-bookworm"

# Optional hardware access: override together with an accelerator-specific image.
immich_ml_devices: []
immich_ml_usb_bus: ""

# Force re-deploy even when no template changes are detected
immich_force_restart: "{{ force_restart | default(false) | bool }}"
