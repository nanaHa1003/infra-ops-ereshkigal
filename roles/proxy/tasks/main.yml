---
- name: Create Caddy stack directory
  ansible.builtin.file:
    path: "{{ stack_root }}/proxy"
    state: directory
    mode: "0755"

- name: Deploy Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ stack_root }}/proxy/Caddyfile"
    mode: '0600'
  diff: false
  no_log: true
  register: proxy_caddy_config

- name: Deploy Caddy Compose
  ansible.builtin.template:
    src: proxy.yml.j2
    dest: "{{ stack_root }}/proxy/docker-compose.yml"
    mode: '0644'
  register: proxy_caddy_compose

- name: Create Docker socket proxy directory
  ansible.builtin.file:
    path: "{{ stack_root }}/docker-proxy"
    state: directory
    mode: "0755"

- name: Deploy Docker socket proxy Compose
  ansible.builtin.template:
    src: docker-socket.yml.j2
    dest: "{{ stack_root }}/docker-proxy/docker-compose.yml"
    mode: '0644'
  register: proxy_socket_compose

- name: Ensure shared Docker networks exist
  ansible.builtin.import_tasks: networks.yml
  tags: [molecule-notest]

- name: Start/Update Caddy reverse proxy
  community.docker.docker_compose_v2:
    project_src: "{{ stack_root }}/proxy"
    project_name: proxy
    files:
      - docker-compose.yml
      - ../docker-proxy/docker-compose.yml
    services: [caddy]
    dependencies: false
    state: present
    pull: "{{ 'always' if pull_images | default(false) | bool else 'missing' }}"
    recreate: "{{ 'always' if proxy_caddy_config.changed or proxy_force_restart | bool else 'auto' }}"
  tags: [molecule-notest]

- name: Start/Update Docker socket proxies
  community.docker.docker_compose_v2:
    project_src: "{{ stack_root }}/proxy"
    project_name: proxy
    files:
      - docker-compose.yml
      - ../docker-proxy/docker-compose.yml
    services: [docker-ro, docker-rw]
    dependencies: false
    state: present
    pull: "{{ 'always' if pull_images | default(false) | bool else 'missing' }}"
    recreate: "{{ 'always' if proxy_force_restart | bool else 'auto' }}"
  tags: [molecule-notest]
