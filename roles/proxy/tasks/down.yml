---
- name: Check if Caddy stack exists before stopping
  ansible.builtin.stat:
    path: "{{ stack_root }}/proxy/docker-compose.yml"
  register: proxy_caddy_compose_file

- name: Check if Docker socket proxy stack exists before stopping
  ansible.builtin.stat:
    path: "{{ stack_root }}/docker-proxy/docker-compose.yml"
  register: proxy_socket_compose_file

- name: Shut down reverse proxy and socket proxies
  community.docker.docker_compose_v2:
    project_src: "{{ stack_root }}"
    project_name: proxy
    files: >-
      {{ ([stack_root ~ '/proxy/docker-compose.yml'] if proxy_caddy_compose_file.stat.exists else [])
         + ([stack_root ~ '/docker-proxy/docker-compose.yml'] if proxy_socket_compose_file.stat.exists else []) }}
    state: absent
    remove_volumes: false
  when: proxy_caddy_compose_file.stat.exists or proxy_socket_compose_file.stat.exists
